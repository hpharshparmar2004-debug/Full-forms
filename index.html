<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD Mock Test - 50 MCQs</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

.login-page,
.quiz-page,
.result-page{
    display:none;
    min-height:100vh;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.active{
    display:flex;
}

.card{
    width:100%;
    max-width:900px;
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1,h2,h3{
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.question-box{
    background:#334155;
    padding:20px;
    border-radius:15px;
}

.option{
    background:#475569;
    padding:12px;
    margin-top:12px;
    border-radius:10px;
    cursor:pointer;
}

.option:hover{
    background:#64748b;
}

.navigation{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    gap:10px;
}

.question-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(45px,1fr));
    gap:10px;
    margin-top:20px;
}

.qbtn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:none;
    color:white;
    font-weight:bold;
}

.not-answered{
    background:red;
}

.answered{
    background:green;
}

#timer{
    font-size:22px;
    font-weight:bold;
    color:#facc15;
}

.correct{
    color:#22c55e;
}

.wrong{
    color:#ef4444;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-page active" id="loginPage">

<div class="card">

<h1 align="center">CMD MOCK TEST</h1>

<input type="text" id="username" placeholder="Username (rgcsm001)">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Start Exam</button>

<h3 id="loginMsg" style="color:red;"></h3>

</div>

</div>

<!-- QUIZ PAGE -->

<div class="quiz-page" id="quizPage">

<div class="card">

<div class="topbar">

<h2 id="studentName"></h2>

<div id="timer">60:00</div>

</div>

<div class="question-box">

<h3 id="questionText"></h3>

<div id="optionsContainer"></div>

</div>

<div class="navigation">

<button onclick="prevQuestion()">Previous</button>

<button onclick="nextQuestion()">Save & Next</button>

</div>

<div class="question-grid" id="questionGrid"></div>

<button style="width:100%;margin-top:20px;background:#16a34a;"
onclick="submitQuiz()">Submit Exam</button>

</div>

</div>

<!-- RESULT PAGE -->

<div class="result-page" id="resultPage">

<div class="card">

<h1 align="center">Exam Result</h1>

<h2 id="finalScore"></h2>

<h3 id="correctAns" class="correct"></h3>

<h3 id="wrongAns" class="wrong"></h3>

</div>

</div>

<script>

const quizData = [

{
question:"1. Which command displays files and folders in CMD?",
options:["DIR","CLS","TREE","COPY"],
answer:"DIR"
},

{
question:"2. Which command clears the screen?",
options:["CLS","DIR","TREE","DATE"],
answer:"CLS"
},

{
question:"3. Which command creates a new folder?",
options:["MD","RD","CD","DIR"],
answer:"MD"
},

{
question:"4. Which command changes directory?",
options:["CD","MD","TREE","CLS"],
answer:"CD"
},

{
question:"5. Which command removes a directory?",
options:["RD","MD","TREE","COPY"],
answer:"RD"
},

{
question:"6. Which command displays folder structure?",
options:["TREE","DIR","CLS","DATE"],
answer:"TREE"
},

{
question:"7. Which command copies files?",
options:["COPY","MOVE","DEL","REN"],
answer:"COPY"
},

{
question:"8. Which command deletes files?",
options:["DEL","COPY","TREE","DIR"],
answer:"DEL"
},

{
question:"9. Which command renames files?",
options:["REN","COPY","MOVE","TYPE"],
answer:"REN"
},

{
question:"10. Which command displays file content?",
options:["TYPE","COPY","DIR","CLS"],
answer:"TYPE"
},

{
question:"11. Which command changes date?",
options:["DATE","TIME","VOL","VER"],
answer:"DATE"
},

{
question:"12. Which command changes time?",
options:["TIME","DATE","VOL","TREE"],
answer:"TIME"
},

{
question:"13. Which command shows Windows version?",
options:["VER","VOL","TREE","CLS"],
answer:"VER"
},

{
question:"14. Which command shows disk label?",
options:["VOL","VER","DATE","TIME"],
answer:"VOL"
},

{
question:"15. Which command formats disk?",
options:["FORMAT","CHKDSK","TREE","VOL"],
answer:"FORMAT"
},

{
question:"16. Which command checks disk?",
options:["CHKDSK","FORMAT","TREE","DIR"],
answer:"CHKDSK"
},

{
question:"17. Which command edits text files?",
options:["EDIT","COPY","TYPE","TREE"],
answer:"EDIT"
},

{
question:"18. Which command moves files?",
options:["MOVE","COPY","DEL","TYPE"],
answer:"MOVE"
},

{
question:"19. Which command exits CMD?",
options:["EXIT","CLS","DIR","TREE"],
answer:"EXIT"
},

{
question:"20. Which command pauses output screen?",
options:["DIR/P","DIR/W","TREE","CLS"],
answer:"DIR/P"
},

{
question:"21. Which command displays wide list?",
options:["DIR/W","DIR/P","TREE","VOL"],
answer:"DIR/W"
},

{
question:"22. Which command shows subdirectories?",
options:["DIR/S","DIR/W","TREE","CLS"],
answer:"DIR/S"
},

{
question:"23. Which command sorts by name?",
options:["DIR/O:N","DIR/O:S","DIR/O:D","DIR/P"],
answer:"DIR/O:N"
},

{
question:"24. Which command sorts by size?",
options:["DIR/O:S","DIR/O:N","DIR/O:D","TREE"],
answer:"DIR/O:S"
},

{
question:"25. Which command sorts by date?",
options:["DIR/O:D","DIR/O:S","DIR/O:N","DIR/W"],
answer:"DIR/O:D"
},

{
question:"26. Which key saves COPY CON file?",
options:["Ctrl + Z","Ctrl + C","Ctrl + S","Ctrl + X"],
answer:"Ctrl + Z"
},

{
question:"27. Which command creates file using keyboard?",
options:["COPY CON","TYPE","EDIT","TREE"],
answer:"COPY CON"
},

{
question:"28. Which command goes to parent directory?",
options:["CD..","CD\\","DIR","TREE"],
answer:"CD.."
},

{
question:"29. Which command goes to root directory?",
options:["CD\\","CD..","TREE","VOL"],
answer:"CD\\"
},

{
question:"30. Which command changes drive?",
options:["D:","CD D","VOL","TREE"],
answer:"D:"
},

{
question:"31. Which command compares files?",
options:["COMP","COPY","MOVE","DEL"],
answer:"COMP"
},

{
question:"32. Which command searches text?",
options:["FIND","TREE","TYPE","VOL"],
answer:"FIND"
},

{
question:"33. Which command displays memory info?",
options:["MEM","DIR","TREE","CLS"],
answer:"MEM"
},

{
question:"34. Which command pauses batch execution?",
options:["PAUSE","STOP","WAIT","BREAK"],
answer:"PAUSE"
},

{
question:"35. Which command changes prompt style?",
options:["PROMPT","PATH","TREE","DIR"],
answer:"PROMPT"
},

{
question:"36. Which command changes file attributes?",
options:["ATTRIB","COPY","DEL","TREE"],
answer:"ATTRIB"
},

{
question:"37. Which command restores deleted files?",
options:["UNDELETE","COPY","TREE","TYPE"],
answer:"UNDELETE"
},

{
question:"38. Which command backs up files?",
options:["BACKUP","COPY","DIR","TREE"],
answer:"BACKUP"
},

{
question:"39. Which command restores backups?",
options:["RESTORE","BACKUP","COPY","DIR"],
answer:"RESTORE"
},

{
question:"40. Which command displays variables?",
options:["SET","PATH","PROMPT","TREE"],
answer:"SET"
},

{
question:"41. Which command sets executable path?",
options:["PATH","SET","TREE","CLS"],
answer:"PATH"
},

{
question:"42. Which command creates boot disk?",
options:["SYS","FORMAT","TREE","CHKDSK"],
answer:"SYS"
},

{
question:"43. Which command shows IP configuration?",
options:["IPCONFIG","PING","NET","TREE"],
answer:"IPCONFIG"
},

{
question:"44. Which command tests network connection?",
options:["PING","DIR","TREE","CLS"],
answer:"PING"
},

{
question:"45. Which command maps network drive?",
options:["NET USE","PING","DIR","VOL"],
answer:"NET USE"
},

{
question:"46. Which command displays help?",
options:["HELP","DIR","TREE","CLS"],
answer:"HELP"
},

{
question:"47. Which command displays current path?",
options:["CD","TREE","VOL","DATE"],
answer:"CD"
},

{
question:"48. Which command displays current drive?",
options:["VOL","DIR","DATE","TREE"],
answer:"VOL"
},

{
question:"49. Which command is used for file listing?",
options:["DIR","TREE","CLS","DATE"],
answer:"DIR"
},

{
question:"50. Which command displays complete directory hierarchy?",
options:["TREE","DIR","CLS","VOL"],
answer:"TREE"
}

];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);
let timeLeft = 60 * 60;

function login(){

let user = document.getElementById("username").value.trim();
let pass = document.getElementById("password").value.trim();

let regex = /^rgcsm\d{3}$/;

if(regex.test(user)){

let number = user.slice(-3);

if(pass === number){

document.getElementById("loginPage").classList.remove("active");

document.getElementById("quizPage").classList.add("active");

document.getElementById("studentName").innerHTML =
"Candidate: " + user;

loadQuestion();

createQuestionGrid();

startTimer();

}else{

document.getElementById("loginMsg").innerHTML =
"Invalid Password";

}

}else{

document.getElementById("loginMsg").innerHTML =
"Username format should be rgcsm001";

}

}

function loadQuestion(){

const q = quizData[currentQuestion];

document.getElementById("questionText").innerHTML =
q.question;

const optionsContainer =
document.getElementById("optionsContainer");

optionsContainer.innerHTML = "";

q.options.forEach(option=>{

const div = document.createElement("div");

div.classList.add("option");

div.innerHTML = `
<label>
<input type="radio"
name="option"
value="${option}"
${userAnswers[currentQuestion]===option ? "checked" : ""}
onchange="saveAnswer('${option}')">
${option}
</label>
`;

optionsContainer.appendChild(div);

});

updateGrid();

}

function saveAnswer(answer){

userAnswers[currentQuestion] = answer;

updateGrid();

}

function nextQuestion(){

if(currentQuestion < quizData.length-1){

currentQuestion++;

loadQuestion();

}

}

function prevQuestion(){

if(currentQuestion > 0){

currentQuestion--;

loadQuestion();

}

}

function createQuestionGrid(){

const grid = document.getElementById("questionGrid");

for(let i=0;i<quizData.length;i++){

const btn = document.createElement("button");

btn.innerHTML = i+1;

btn.classList.add("qbtn","not-answered");

btn.id = "qbtn"+i;

btn.onclick = ()=>{

currentQuestion = i;

loadQuestion();

};

grid.appendChild(btn);

}

}

function updateGrid(){

for(let i=0;i<quizData.length;i++){

const btn = document.getElementById("qbtn"+i);

if(userAnswers[i]){

btn.classList.remove("not-answered");

btn.classList.add("answered");

}else{

btn.classList.remove("answered");

btn.classList.add("not-answered");

}

}

}

function startTimer(){

const timer = setInterval(()=>{

let minutes = Math.floor(timeLeft/60);

let seconds = timeLeft%60;

document.getElementById("timer").innerHTML =
`${minutes}:${seconds<10?'0':''}${seconds}`;

timeLeft--;

if(timeLeft < 0){

clearInterval(timer);

submitQuiz();

}

},1000);

}

function submitQuiz(){

let score = 0;

for(let i=0;i<quizData.length;i++){

if(userAnswers[i] === quizData[i].answer){

score++;

}

}

document.getElementById("quizPage").classList.remove("active");

document.getElementById("resultPage").classList.add("active");

document.getElementById("finalScore").innerHTML =
"Your Score: " + score + " / " + quizData.length;

document.getElementById("correctAns").innerHTML =
"Correct Answers: " + score;

document.getElementById("wrongAns").innerHTML =
"Wrong Answers: " + (quizData.length - score);

}

</script>

</body>
</html>
