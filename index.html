.login-box,.quiz-box,.result-box{

padding:20px;

}

}

}
.option{

padding:10px;

.nav{
display:flex;

}

width:35px;
height:35px;
border-radius:50%;

align-items:center;
justify-content:center;

color:white;
font-size:14px;
cursor:pointer;
}
.green{
background:green !important;
}
#timer{
font-size:20px;
font-weight:bold;
color:#d60000;
float:right;
}
.hidden{
display:none;

<body>

<div class="login-box" id="loginBox">
<h2 align="center">Ultimate IT Quiz Login</h2>

<input type="password" id="password" placeholder="Enter Password (001)">
<button onclick="login()">Start Quiz</button>

</div>

<div class="quiz-box hidden" id="quizBox">

<p><b>Candidate:</b> <span id="candidate"></span></p>
<div id="timer">60:00</div>
<hr>
<h3 id="question"></h3>
<div id="options"></div>
<button onclick="prevQuestion()">Previous</button>
<button onclick="nextQuestion()">Save & Next</button>
<button onclick="submitQuiz()" style="background:blue">Submit</button>
<div class="nav" id="nav"></div>
</div>

<div class="result-box hidden" id="resultBox">
<h2>Quiz Result</h2>
<h3 id="score"></h3>
</div>

let current=0;
let answers=new Array(quiz.length).fill(null);

function login(){
let u=document.getElementById('username').value;
let p=document.getElementById('password').value;
let match=u.match(/^rgcsm(\d{3})$/);
if(match && match[1]===p){
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('quizBox').classList.remove('hidden');
document.getElementById('candidate').innerText=u;
loadQuestion();
startTimer();
}else{
document.getElementById('loginMsg').innerText='Invalid Login';
}
}

function loadQuestion(){
let q=quiz[current];
document.getElementById('question').innerText=(current+1)+'. '+q.q;
let options='';
q.o.forEach((opt,i)=>{
options+=`<div class='option' onclick='selectOption(${i})'>${opt}</div>`;
});
document.getElementById('options').innerHTML=options;
updateNav();
}

function selectOption(i){
answers[current]=i;
updateNav();
}

function nextQuestion(){
if(current<quiz.length-1){
current++;
loadQuestion();
}
}

function prevQuestion(){
if(current>0){
current--;
loadQuestion();
}
}

function updateNav(){
let nav='';
for(let i=0;i<quiz.length;i++){
nav+=`<div class='circle ${answers[i]!=null?'green':''}' onclick='gotoQuestion(${i})'>${i+1}</div>`;
}
document.getElementById('nav').innerHTML=nav;
}

function gotoQuestion(i){
current=i;
loadQuestion();
}

function submitQuiz(){
let score=0;
quiz.forEach((q,i)=>{
if(answers[i]===q.a) score++;
});
document.getElementById('quizBox').classList.add('hidden');
document.getElementById('resultBox').classList.remove('hidden');
document.getElementById('score').innerText='Your Score: '+score+' / '+quiz.length;
}

let time=3600;
function startTimer(){
setInterval(()=>{
let m=Math.floor(time/60);
let s=time%60;
document.getElementById('timer').innerText=`${m}:${s<10?'0'+s:s}`;
time--;
if(time<0){
submitQuiz();
}
},1000);
}
