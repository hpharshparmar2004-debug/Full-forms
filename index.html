<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Full Forms Quiz</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:0;
}
.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h1{text-align:center;}
#timer{
    font-size:20px;
    color:red;
    text-align:right;
    margin-bottom:10px;
}
.question{
    font-size:22px;
    margin-bottom:15px;
}
.options label{
    display:block;
    background:#f0f0f0;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
}
.options input{
    margin-right:10px;
}
.buttons{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
#nextBtn{background:#28a745;color:white;}
#prevBtn{background:#6c757d;color:white;}
#submitBtn{background:blue;color:white;display:none;}
#questionNumbers{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}
.qnum{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:red;
}
.attempted{background:green !important;}
#result{
    text-align:center;
    font-size:24px;
    margin-top:20px;
    font-weight:bold;
}
.login-box{
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
.login-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
.login-box button{
    width:100%;
    background:#007bff;
    color:white;
}
#userDisplay{
    font-weight:bold;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div id="loginPage" class="login-box">
<h2>Quiz Login</h2>
<input type="text" id="username" placeholder="Enter Username">
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<p id="loginError" style="color:red;text-align:center;"></p>
</div>

<div class="container" id="quizContainer" style="display:none;">
<div id="userDisplay"></div>
<h1>Computer Full Forms Quiz</h1>
<div id="timer">60:00</div>
<div id="quiz"></div>
<div class="buttons">
<button id="prevBtn" onclick="prevQuestion()">Previous</button>
<button id="nextBtn" onclick="nextQuestion()">Save & Next</button>
<button id="submitBtn" onclick="submitQuiz()">Submit</button>
</div>
<div id="questionNumbers"></div>
<div id="result"></div>
</div>

let currentQuestion = 0;
let score = 0;
let answers = new Array(quizData.length).fill(null);

function login(){
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const regex = /^rgcsm(\d{3})$/;

    if(regex.test(username)){
        const num = username.match(regex)[1];
        if(password === num){
            document.getElementById('loginPage').style.display='none';
            document.getElementById('quizContainer').style.display='block';
            document.getElementById('userDisplay').innerText='User: '+username;
            loadQuestion();
            createQuestionNumbers();
            startTimer();
            return;
        }
    }
    document.getElementById('loginError').innerText='Invalid Login';
}

function shuffleArray(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function loadQuestion(){
    const q = quizData[currentQuestion];
    let html = `<div class="question">Q${currentQuestion+1}. What is the full form of ${q.question}?</div>`;
    html += '<div class="options">';

    if(!q.shuffledOptions){
        q.shuffledOptions = shuffleArray(q.options);
    }

    q.shuffledOptions.forEach(option=>{
        html += `
        <label>
        <input type="radio" name="option" value="${option}" ${answers[currentQuestion]===option?'checked':''}>
        ${option}
        </label>`;
    });

    html += '</div>';
    document.getElementById('quiz').innerHTML = html;

    document.getElementById('prevBtn').style.display = currentQuestion===0?'none':'inline-block';
    document.getElementById('nextBtn').style.display = currentQuestion===quizData.length-1?'none':'inline-block';
    document.getElementById('submitBtn').style.display = currentQuestion===quizData.length-1?'inline-block':'none';
}

function saveAnswer(){
    const selected = document.querySelector('input[name="option"]:checked');
    if(selected){
        answers[currentQuestion] = selected.value;
        document.getElementsByClassName('qnum')[currentQuestion].classList.add('attempted');
    }
}

function nextQuestion(){
    saveAnswer();
    if(currentQuestion < quizData.length-1){
        currentQuestion++;
        loadQuestion();
    }
}

function prevQuestion(){
    saveAnswer();
    if(currentQuestion > 0){
        currentQuestion--;
        loadQuestion();
    }
}

function createQuestionNumbers(){
    const container = document.getElementById('questionNumbers');
    for(let i=0;i<quizData.length;i++){
        const div = document.createElement('div');
        div.classList.add('qnum');
        div.innerText=i+1;
        div.onclick=()=>{
            saveAnswer();
            currentQuestion=i;
            loadQuestion();
        };
        container.appendChild(div);
    }
}

function submitQuiz(){
    saveAnswer();

    score = 0;
    quizData.forEach((q,index)=>{
        if(answers[index]===q.answer){
            score++;
        }
    });

    document.getElementById('quiz').innerHTML='';
    document.querySelector('.buttons').style.display='none';
    document.getElementById('questionNumbers').style.display='none';
    document.getElementById('result').innerHTML=`You scored ${score} out of ${quizData.length}`;
}

function startTimer(){
    let time = 60*60;
    const timer = document.getElementById('timer');

    const interval = setInterval(()=>{
        const minutes = Math.floor(time/60);
        const seconds = time%60;
        timer.innerText = `${minutes}:${seconds<10?'0':''}${seconds}`;

        if(time<=0){
            clearInterval(interval);
            submitQuiz();
        }
        time--;
    },1000);
}
